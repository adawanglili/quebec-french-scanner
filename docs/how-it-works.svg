<text class="title" x="310" y="38">How the scanner works</text><text class="sub" x="310" y="62">Rules find. A model judges. A person decides.</text><g class="node base" id="url"><rect class="glow" x="205" y="99" width="210" height="50" rx="14" style="animation-delay:0s"/><rect class="b" x="210" y="104" width="200" height="40" rx="10"/><text class="t" x="310.0" y="129.0">Site URL</text></g><path class="edge" d="M310,144 V170" marker-end="url(#ah)"/><g class="node base" id="crawl"><rect class="glow" x="205" y="167" width="210" height="64" rx="14" style="animation-delay:1s"/><rect class="b" x="210" y="172" width="200" height="54" rx="10"/><text class="t" x="310.0" y="195.0">Crawl</text><text class="d" x="310.0" y="214.0">French pages first</text></g><path class="edge" d="M310,226 V266" marker-end="url(#ah)"/><rect class="cont" x="60" y="244" width="500" height="212" rx="14"/><text class="cap" x="76" y="446">RUNS ON MY COMPUTER · NO TOKENS SPENT</text><g class="node rules" id="n1"><rect class="glow" x="175" y="267" width="270" height="70" rx="14" style="animation-delay:2s"/><rect class="b" x="180" y="272" width="260" height="60" rx="10"/><text class="t" x="310.0" y="298.0">1. NLP checks</text><text class="d" x="310.0" y="317.0">language ID · term list</text></g><path class="edge" d="M310,332 V360" marker-end="url(#ah)"/><g class="node rules" id="n2"><rect class="glow" x="175" y="357" width="270" height="70" rx="14" style="animation-delay:3s"/><rect class="b" x="180" y="362" width="260" height="60" rx="10"/><text class="t" x="310.0" y="388.0">2. Merge repeats</text><text class="d" x="310.0" y="407.0">one finding · many pages</text></g><path class="edge" d="M310,422 V468" marker-end="url(#ah)"/><g class="node base" id="dia"><path class="glow" style="animation-delay:4s" d="M310,464 L414,508 L310,552 L206,508 Z"/><path class="b" d="M310,470 L406,508 L310,546 L214,508 Z"/><text class="t" x="310" y="505" style="font-size:13.5px">Clear or</text><text class="t" x="310" y="522" style="font-size:13.5px">ambiguous?</text></g><path class="edge" d="M214,508 H96 V812 H208" marker-end="url(#ah)"/><text class="lbl" x="104" y="500">clear</text><path class="edge" d="M310,546 V586" marker-end="url(#ah)"/><text class="lbl" x="318" y="572">ambiguous</text><g class="node ground" id="n3"><rect class="glow" x="185" y="583" width="250" height="70" rx="14" style="animation-delay:5.5s"/><rect class="b" x="190" y="588" width="240" height="60" rx="10"/><text class="t" x="310.0" y="614.0">3. Grounding</text><text class="d" x="310.0" y="633.0">fetch the OQLF record</text></g><g class="node ground"><path class="b" d="M462,600 v42 a54.0,8 0 0 0 108,0 v-42 a54.0,8 0 0 0 -108,0 a54.0,8 0 0 0 108,0"/><text class="t" x="516.0" y="624" style="font-size:13px">OQLF data</text><text class="d" x="516.0" y="640">GDT records</text></g><path class="edge" d="M462,618 H432" marker-end="url(#ah)"/><path class="edge" d="M310,648 V684" marker-end="url(#ah)"/><g class="node llm" id="n4"><rect class="glow" x="165" y="681" width="290" height="70" rx="14" style="animation-delay:7s"/><rect class="b" x="170" y="686" width="280" height="60" rx="10"/><text class="t" x="310.0" y="712.0">4. LLM second pass</text><text class="d" x="310.0" y="731.0">one sentence · one term · one record</text></g><path class="edge" d="M310,746 V790" marker-end="url(#ah)"/><g class="node base" id="rep"><rect class="glow" x="205" y="787" width="210" height="52" rx="14" style="animation-delay:8.5s"/><rect class="b" x="210" y="792" width="200" height="42" rx="10"/><text class="t" x="310.0" y="818.0">Report</text></g><path class="edge" d="M310,834 V868" marker-end="url(#ah)"/><g class="node human" id="n5"><rect class="glow" x="175" y="865" width="270" height="70" rx="14" style="animation-delay:10s"/><rect class="b" x="180" y="870" width="260" height="60" rx="10"/><text class="t" x="310.0" y="896.0">5. Human review</text><text class="d" x="310.0" y="915.0">correct · wrong · unsure</text></g><g class="note"><rect class="b" x="462" y="770" width="128" height="74" rx="8"/><text class="t" x="526" y="792" style="font-size:12.5px">Review rule</text><text class="d" x="526" y="810">An LLM “ok” never</text><text class="d" x="526" y="826">clears alt text</text></g><path class="fb" d="M440,912 H600 V302 H446" marker-end="url(#ah)"/><text class="lbl" x="0" y="0" transform="translate(592,640) rotate(-90)" style="text-anchor:middle">verdicts update the term list (planned)</text>
