<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 960" role="img" aria-labelledby="dt dd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="dt">How the scanner works</title>
<desc id="dd">The scanner crawls French pages first. On my own computer, step 1 runs NLP checks with language identification and a term list, and step 2 merges repeated strings into one finding. Clear findings go straight to the report. Ambiguous ones go to step 3, grounding, which fetches the matching OQLF record, and then to step 4, an LLM second pass that judges one sentence with one term and one record. All findings reach step 5, human review. A review rule says an LLM ok never clears alt text. A dotted line shows that reviewer verdicts will update the term list used by the checks, which is planned.</desc>
