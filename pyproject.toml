[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qfscan"
version = "0.1.0"
description = "Quebec French website scanner: finds potential French language gaps for human review."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lili Wang" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lingua-language-detector>=2.0",
    "wordfreq>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qfscan = "qfscan.__main__:main"

[tool.setuptools]
packages = ["qfscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
